services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgresql://letter_box:letter_box_dev@postgres:5432/letter_box
      REDIS_URL: redis://redis:6379
      CREDENTIALS_PATH: /app/data/credentials.json
      LETTER_BOX_ENCRYPTION_KEY: ${LETTER_BOX_ENCRYPTION_KEY:-development-encryption-key-change-before-production}
      JWT_SECRET: ${JWT_SECRET:-development-jwt-secret-change-before-production}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      OAUTH_GMAIL_CLIENT_ID: ${OAUTH_GMAIL_CLIENT_ID:-}
      OAUTH_GMAIL_CLIENT_SECRET: ${OAUTH_GMAIL_CLIENT_SECRET:-}
      OAUTH_YANDEX_CLIENT_ID: ${OAUTH_YANDEX_CLIENT_ID:-}
      OAUTH_YANDEX_CLIENT_SECRET: ${OAUTH_YANDEX_CLIENT_SECRET:-}
    ports:
      - "3000:3000"
    volumes:
      - letter_box_server:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile.server
    command: ["node", "apps/backend/dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://letter_box:letter_box_dev@postgres:5432/letter_box
      REDIS_URL: redis://redis:6379
      CREDENTIALS_PATH: /app/data/credentials.json
      LETTER_BOX_ENCRYPTION_KEY: ${LETTER_BOX_ENCRYPTION_KEY:-development-encryption-key-change-before-production}
      JWT_SECRET: ${JWT_SECRET:-development-jwt-secret-change-before-production}
      SYNC_WORKER_CONCURRENCY: ${SYNC_WORKER_CONCURRENCY:-4}
      LETTER_BOX_PROCESS_ROLE: worker
      # Prefer in-compose Ollama; override with host.docker.internal for native macOS Metal.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      TAG_SWEEP_INTERVAL_MS: ${TAG_SWEEP_INTERVAL_MS:-60000}
      TAG_MAX_ATTEMPTS: ${TAG_MAX_ATTEMPTS:-3}
      OAUTH_GMAIL_CLIENT_ID: ${OAUTH_GMAIL_CLIENT_ID:-}
      OAUTH_GMAIL_CLIENT_SECRET: ${OAUTH_GMAIL_CLIENT_SECRET:-}
      OAUTH_YANDEX_CLIENT_ID: ${OAUTH_YANDEX_CLIENT_ID:-}
      OAUTH_YANDEX_CLIENT_SECRET: ${OAUTH_YANDEX_CLIENT_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - letter_box_server:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Optional: docker compose --profile ai up -d
  # On macOS Docker this is CPU-only (no Metal). Prefer native Ollama.app for speed,
  # and set OLLAMA_URL=http://host.docker.internal:11434 for the worker.
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - letter_box_ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: letter_box
      POSTGRES_USER: letter_box
      POSTGRES_PASSWORD: letter_box_dev
    ports:
      - "5432:5432"
    volumes:
      - letter_box_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letter_box -d letter_box"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - letter_box_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  letter_box_server:
  letter_box_postgres:
  letter_box_redis:
  letter_box_ollama:
